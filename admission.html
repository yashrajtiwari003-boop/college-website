<h2>College Admission Form</h2>
<p>Please fill in the following details for admission enquiry.</p>
<form>
<label>Full Name</label><input type="text" required>
<label>Date of Birth</label><input type="date" required>
<label>Email Address</label><input type="email" required>
<label>Phone Number</label><input type="tel" required>
<label>Gender</label><div class="radio-group"><label><input type="radio" name="g"> Male</label><label><input type="radio" name="g"> Female</label><label><input type="radio" name="g"> Other</label></div>
<label>Address</label><textarea></textarea>
<label>Department</label><select><option>Science</option><option>Arts</option><option>Commerce</option></select>
<label>Course</label><select><option>Computer Science</option><option>Mathematics</option><option>Physics</option><option>English</option><option>Sociology</option><option>Economics</option><option>Accounting</option></select>
<label>Previous Qualification</label><input type="text">
<label>Percentage/Grade</label><input type="text">
<label>Category</label><select><option>General</option><option>SC</option><option>ST</option><option>OBC</option><option>Other</option></select>
<label>Upload Photograph</label><input type="file">
<label>Hobbies and Interests</label><textarea></textarea>
<div><button type="submit">Submit Application</button> <button type="reset">Reset</button></div>
</form>
